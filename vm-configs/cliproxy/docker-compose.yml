services:
  cli-proxy-api:
    image: eceasy/cli-proxy-api:latest
    restart: unless-stopped
    ports:
      - "8317:8317"                 # API/proxy + painel web (Traefik roteia o dominio p/ ESTA porta)
      - "8765:8765"                 # callback OAuth (usado so via tunel SSH, nunca exposto)
    volumes:
      - /data/coolify-apps/cliproxy/config.yaml:/CLIProxyAPI/config.yaml
      - cliproxy-auth:/root/.cli-proxy-api
      - cliproxy-logs:/CLIProxyAPI/logs

volumes:
  cliproxy-auth:
  cliproxy-logs:
