services:
  cli-proxy-api:
    image: eceasy/cli-proxy-api:latest
    restart: unless-stopped
    ports:
      - "8317"                      # o Coolify roteia o dominio pra ca (Traefik + HTTPS)
    volumes:
      - cliproxy-auth:/root/.cli-proxy-api   # PERSISTE os logins entre deploys
      - cliproxy-logs:/CLIProxyAPI/logs
      # O config.yaml entra via "File Mount" no Coolify -> /CLIProxyAPI/config.yaml

volumes:
  cliproxy-auth:
  cliproxy-logs:
