services:
  cli-proxy-api:
    image: eceasy/cli-proxy-api:latest
    restart: unless-stopped
    ports:
      - "8317"                      # API/proxy - o Coolify roteia o dominio pra ca (Traefik + HTTPS)
      - "8765:8765"                 # porta de callback OAuth p/ login (usada so via tunel SSH, NUNCA exposta ao publico)
    volumes:
      - /data/coolify-apps/cliproxy/config.yaml:/CLIProxyAPI/config.yaml
      - cliproxy-auth:/root/.cli-proxy-api   # PERSISTE os logins entre deploys
      - cliproxy-logs:/CLIProxyAPI/logs

volumes:
  cliproxy-auth:
  cliproxy-logs:
