services:
  cli-proxy-api:
    image: eceasy/cli-proxy-api:latest
    restart: unless-stopped
    ports:
      - "8317:8317"     # API/proxy + painel web (Traefik roteia o dominio p/ ESTA porta)
      # Portas de callback OAuth (padrao "localhost:PORTA" de cada provedor).
      # NAO abertas no firewall da Oracle - alcancadas so via tunel SSH.
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - /data/coolify-apps/cliproxy/config.yaml:/CLIProxyAPI/config.yaml
      - cliproxy-auth:/root/.cli-proxy-api
      - cliproxy-logs:/CLIProxyAPI/logs

volumes:
  cliproxy-auth:
  cliproxy-logs:
